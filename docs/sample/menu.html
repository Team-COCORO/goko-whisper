<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>五高喫茶・お品書き</title>
<style>
  :root {
    --bg-base: #f6f1e8;
    --paper-card: #fbf9f4;
    --navy-main: #1f3144;
    --brand-red: #8b3a2b; /* 弁柄・朱色 */
    --brass-gold: #c5a059;
    --sage-green: #687e6c; /* シールの若草色 */
    --border-card: #d9cfbe;
    --text-sub: #5c554e;
    --font-serif: "HiraMinProN-W3", "游明朝", "YuMincho", "MS P明朝", serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    background-color: var(--bg-base);
    font-family: var(--font-serif);
    color: var(--navy-main);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .page-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 右上固定：スタンプ帖アイコン */
  .book-trigger-btn {
    position: fixed;
    top: 12px;
    right: 14px;
    width: 44px;
    height: 60px;
    background: #243444;
    border: 1.5px solid var(--brass-gold);
    border-radius: 2px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f7f1e3;
    z-index: 100;
  }
  .book-trigger-btn .label {
    writing-mode: vertical-rl;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.15em;
  }
  .book-trigger-btn .badge {
    position: absolute;
    bottom: -5px;
    background: var(--brand-red);
    color: #fff;
    font-size: 8px;
    padding: 1px 4px;
    border-radius: 6px;
    border: 1px solid var(--brass-gold);
  }

  /* ヘッダー・店舗エンブレム */
  .shop-header {
    text-align: center;
    margin-bottom: 14px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* カップシール連動エンブレム */
  .seal-emblem {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px dashed var(--sage-green);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    background: #faf7f0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    position: relative;
  }
  .seal-emblem::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1px solid rgba(104, 126, 108, 0.4);
  }
  .seal-emblem-cats {
    font-size: 18px;
    line-height: 1;
    color: var(--sage-green);
  }
  .seal-emblem-sub {
    font-size: 6px;
    letter-spacing: 0.08em;
    color: var(--brand-red);
    margin-top: 2px;
  }

  .shop-meta-tag {
    font-size: 11px;
    color: var(--sage-green);
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
  .shop-title-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .shop-booth-num {
    font-size: 14px;
    font-weight: bold;
    color: var(--brand-red);
    border: 1px solid var(--brand-red);
    border-radius: 12px;
    padding: 0 6px;
  }
  .shop-title {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
    color: var(--navy-main);
    letter-spacing: 0.15em;
  }
  .shop-org {
    margin: 0;
    font-size: 11px;
    color: var(--text-sub);
    letter-spacing: 0.05em;
  }

  /* 看板帯・案内マップ呼び出し */
  .shop-banner {
    width: 100%;
    max-width: 360px;
    border-top: 1px dashed var(--border-card);
    border-bottom: 1px dashed var(--border-card);
    padding: 7px 4px;
    margin: 10px 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .shop-place-text {
    font-size: 11.5px;
    color: var(--text-sub);
  }
  .map-link-btn {
    font-size: 11px;
    color: var(--brand-red);
    background: none;
    border: 1px solid var(--brand-red);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .map-link-btn:active {
    background: rgba(139, 58, 43, 0.08);
  }

  /* お品書きセクション見出し */
  .menu-heading {
    text-align: center;
    margin-bottom: 14px;
  }
  .menu-title {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: bold;
    color: var(--brand-red);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
  }
  .menu-whisper-hint {
    margin: 0;
    font-size: 12px;
    color: var(--text-sub);
    letter-spacing: 0.05em;
  }

  /* メニュー一覧 */
  .menu-list {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .menu-card {
    background: var(--paper-card);
    border: 1px solid var(--border-card);
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    display: flex;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .menu-card:active {
    transform: scale(0.98);
  }

  .menu-thumb-wrap {
    width: 86px;
    height: 86px;
    border-radius: 6px;
    overflow: hidden;
    background-color: #eae4da;
    border: 1px solid var(--border-card);
    flex-shrink: 0;
  }
  .menu-thumb-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .menu-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .menu-name {
    margin: 0;
    font-size: 15px;
    font-weight: bold;
    color: var(--navy-main);
  }
  .menu-desc-short {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
  }
  .menu-tap-hint {
    font-size: 10.5px;
    color: var(--brand-red);
    align-self: flex-end;
  }

  /* モーダル */
  .modal-scrim {
    position: fixed;
    inset: 0;
    background: rgba(22, 16, 12, 0.65);
    backdrop-filter: blur(2px);
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-scrim.show {
    opacity: 1;
    pointer-events: auto;
  }

  .detail-modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -45%) scale(0.95);
    width: 88%;
    max-width: 330px;
    background: radial-gradient(ellipse at center, #fbf9f4 0%, #f4ede1 100%);
    border: 2px solid var(--brass-gold);
    border-radius: 6px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.35);
    z-index: 510;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .detail-modal.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  .modal-img-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 4px;
    overflow: hidden;
    background: #eae4da;
    border: 1px solid var(--border-card);
    margin-bottom: 10px;
  }
  .modal-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modal-title {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: bold;
    color: var(--navy-main);
    border-bottom: 1.5px solid var(--brand-red);
    padding-bottom: 3px;
    width: 100%;
    text-align: center;
  }
  .modal-desc {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.6;
    text-align: justify;
  }

  .modal-close-btn {
    background: var(--navy-main);
    color: #f7f1e3;
    border: 1px solid var(--brass-gold);
    border-radius: 4px;
    padding: 5px 18px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }

  /* 下部ナビゲーション */
  .bottom-nav {
    height: 64px;
    background: var(--navy-main);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid rgba(197, 160, 89, 0.3);
    z-index: 50;
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: rgba(246, 241, 232, 0.65);
    text-decoration: none;
    font-size: 11px;
    gap: 4px;
  }
  .nav-item.active {
    color: var(--brass-gold);
  }
  .nav-icon {
    font-size: 18px;
    line-height: 1;
  }
</style>
</head>
<body>

  <!-- 右上スタンプ帖ボタン -->
  <div class="book-trigger-btn">
    <div class="label">スタンプ帖</div>
    <div class="badge">0/3</div>
  </div>

  <div class="page-scroll-area">
    
    <!-- 店舗情報ヘッダー（カップシール連携） -->
    <header class="shop-header">
      <div class="seal-emblem">
        <span class="seal-emblem-cats">🐾 🐈 🐈</span>
        <span class="seal-emblem-sub">EST. 1887</span>
      </div>
      <span class="shop-meta-tag">キャンパスミュージアム推進機構</span>
      <div class="shop-title-row">
        <span class="shop-booth-num">18ばん</span>
        <h1 class="shop-title">五高喫茶</h1>
      </div>
      <p class="shop-org">チームCOCORO</p>
    </header>

    <!-- 看板・案内マップ動線 -->
    <div class="shop-banner">
      <span class="shop-place-text">場所：文法棟前・サブステージ脇</span>
      <button class="map-link-btn" onclick="openMapModal()">案内図 ≫</button>
    </div>

    <!-- お品書き見出し -->
    <div class="menu-heading">
      <h2 class="menu-title">お品書き</h2>
      <p class="menu-whisper-hint">囁きは、このお店のどこかに眠っている。</p>
    </div>

    <!-- メニューリスト -->
    <div class="menu-list">
      
      <!-- 1品目：碧空クリームソーダ -->
      <div class="menu-card" onclick="openMenuModal('soda_blue')">
        <div class="menu-thumb-wrap">
          <img src="/images/soda_blue.webp" 
               alt="碧空クリームソーダ" 
               class="menu-thumb-img" 
               loading="eager" 
               decoding="async">
        </div>
        <div class="menu-info">
          <h3 class="menu-name">碧空クリームソーダ</h3>
          <p class="menu-desc-short">澄んだ青のグラデーションが目を惹く、爽やかな炭酸ソーダにバニラアイスを添えて。</p>
          <span class="menu-tap-hint">詳細を見る ≫</span>
        </div>
      </div>

      <!-- 2品目：新緑メロンソーダ -->
      <div class="menu-card" onclick="openMenuModal('soda_green')">
        <div class="menu-thumb-wrap">
          <img src="/images/soda_green.webp" 
               alt="新緑メロンソーダ" 
               class="menu-thumb-img" 
               loading="eager" 
               decoding="async">
        </div>
        <div class="menu-info">
          <h3 class="menu-name">新緑メロンソーダ</h3>
          <p class="menu-desc-short">昔懐かしい喫茶の味わい。鮮やかなエメラルドグリーンと真っ赤なチェリーが彩る王道の一杯。</p>
          <span class="menu-tap-hint">詳細を見る ≫</span>
        </div>
      </div>

    </div>
  </div>

  <!-- 詳細モーダル（商品 / 案内図 共通） -->
  <div id="modal-scrim" class="modal-scrim" onclick="closeModal()"></div>
  <div id="detail-modal" class="detail-modal">
    <div class="modal-img-wrap">
      <img id="modal-img" src="" alt="" class="modal-img">
    </div>
    <h3 id="modal-title" class="modal-title"></h3>
    <p id="modal-desc" class="modal-desc"></p>
    <button class="modal-close-btn" onclick="closeModal()">閉じる</button>
  </div>

  <!-- フッターナビゲーション -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item">
      <span class="nav-icon">🧭</span>
      <span>ホーム</span>
    </a>
    <a href="#" class="nav-item active">
      <span class="nav-icon">🍵</span>
      <span>食品</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">⭐</span>
      <span>プレゼント</span>
    </a>
  </nav>

  <script>
    const MENU_DATA = {
      soda_blue: {
        title: "碧空（あおぞら）クリームソーダ",
        img: "/images/soda_blue.webp",
        desc: "深い青から空色へと移ろうグラデーションが目を惹く一杯。カップには五高喫茶特製の記念シールが貼られています。シュワシュワ弾ける炭酸とアイスのまろやかさをお楽しみください。"
      },
      soda_green: {
        title: "新緑（しんりょく）メロンソーダ",
        img: "/images/soda_green.webp",
        desc: "明治の洋食喫茶文化を想起させる王道のメロンソーダ。赤いチェリーと特製猫シールが目印です。散策の合間のひと休みにどうぞ。"
      },
      map: {
        title: "出店場所（18ばんブース）",
        img: "/images/shop_map.webp",
        desc: "五高記念館と文法棟の間、ロータリー・サブステージ付近に出店しています。ブースの案内板やカップのどこかに『囁き』の手がかりが隠されています。"
      }
    };

    function openMenuModal(key) {
      showModal(MENU_DATA[key]);
    }

    function openMapModal() {
      showModal(MENU_DATA.map);
    }

    function showModal(data) {
      if (!data) return;
      document.getElementById('modal-img').src = data.img;
      document.getElementById('modal-img').alt = data.title;
      document.getElementById('modal-title').textContent = data.title;
      document.getElementById('modal-desc').textContent = data.desc;

      document.getElementById('modal-scrim').classList.add('show');
      document.getElementById('detail-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal-scrim').classList.remove('show');
      document.getElementById('detail-modal').classList.remove('show');
    }
  </script>
</body>
</html>
